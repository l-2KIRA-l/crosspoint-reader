name: Kyrylo build (X4 firmware)

on:
  push:
    branches: [kyrylo-notebook]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false
      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"
      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          pio pkg install -e default
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
      - name: Build firmware
        run: |
          set -euo pipefail
          pio run -e default 2>&1 | tee pio.log | grep -E "error|warning: unused|RAM:|Flash:|SUCCESS|FAILED" || true
          test -f .pio/build/default/firmware.bin
      - name: Show errors
        if: failure()
        run: grep -n -B3 -A3 "error" pio.log | tail -150
      - uses: actions/upload-artifact@v6
        with:
          name: firmware-x4
          path: .pio/build/default/firmware.bin
          if-no-files-found: error
